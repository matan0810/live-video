# Every check a commit must pass. Used by ci.yml (branches and pull requests) and
# deploy.yml (master), so a deploy runs exactly what day-to-day work runs.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  code:
    name: Types, lint, format, audit, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only what ships to viewers blocks: react, react-dom, hls.js and the font.
      - name: Known vulnerabilities in the site's dependencies
        run: npm audit --omit=dev --audit-level=high
      # Build and test tools never reach viewers, and an advisory can land before a fix
      # exists. Report them on every run so they are seen and updated, without blocking.
      - name: Known vulnerabilities in build and test tools (report only)
        run: npm audit --audit-level=high || echo "::warning::Advisories in dev dependencies; see the log above."
      - run: npm run check

  browser:
    name: Browser smoke test (desktop and phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
