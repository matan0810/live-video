# Day-to-day work: every push to a working branch, and every pull request, runs all checks.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
