# Day-to-day work: every push to dev (and to any working branch), and every pull request,
# runs all checks. master runs the same checks in deploy.yml before it deploys.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
