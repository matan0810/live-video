# Deploys the Cloudflare Worker from GitHub, so no local machine is needed.
# Runs on demand, and on pushes to master that change the Worker or the shared code.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#   ADMIN_PASSWORD         the admin area's password
# Until they are set, the deploy job is skipped and the run still passes.
name: Deploy Worker

on:
  push:
    branches: [master]
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

env:
  KV_TITLE: live-video
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Skip until the Cloudflare secrets are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping the Worker deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci

      # The storage is found by its title, and created on the first run. Its id is
      # written into the config only for this run, so nothing has to be committed.
      - name: Find or create the KV storage
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/ensure-kv.mjs "$KV_TITLE" worker/wrangler.jsonc

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --config worker/wrangler.jsonc | tee deploy.log

      - name: Set the admin password
        if: steps.ready.outputs.ok == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::ADMIN_PASSWORD is not set, so the admin area stays locked."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config worker/wrangler.jsonc

      - name: Report the Worker's address
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          {
            echo "### Worker deployed"
            echo
            echo "Address: \`$url\`"
            echo
            echo "Put it in the \`API_URL\` repository variable, then re-run the Deploy workflow."
          } >> "$GITHUB_STEP_SUMMARY"
